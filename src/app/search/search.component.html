<div #searchHost [ngClass]="{
  'pds-search': true,
  'pds-search--selected': isFocused || searchValue.length > 0,
  'pds-search--hover': isHovered && !isFocused && searchValue.length === 0
}"
(mouseenter)="isHovered = true"
(mouseleave)="isHovered = false"
(click)="focusInput()">

  <!-- Search icon — always visible -->
  <svg class="pds-search__icon" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
    <circle cx="6.5" cy="6.5" r="5" fill="none" stroke="currentColor" stroke-width="1.25"/>
    <line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
  </svg>

  <!-- Placeholder — shown when empty and not focused -->
  @if (!isFocused && searchValue.length === 0) {
    <span class="pds-search__placeholder">{{ placeholder }}</span>
  }

  <!-- Input — always in DOM so clicking focuses it immediately -->
  <input
    #searchInput
    type="text"
    class="pds-search__input"
    [class.pds-search__input--hidden]="!isFocused && searchValue.length === 0"
    [(ngModel)]="searchValue"
    placeholder=""
    (focus)="onFocus()"
    (blur)="onBlur()"
    (input)="onInput()"
  />

  <!-- Cancel button — shown when there is a value -->
  @if (searchValue.length > 0) {
    <pds-button
      type="tertiary"
      [size]="0"
      content="only-icon"
      centerIcon="x"
      (click)="clearSearch($event)"
    />
  }

</div>

<!-- Suggestion overlay — fixed, positioned under search with 2px gap -->
@if (overlayVisible) {
  <div class="pds-search__overlay-backdrop" (mousedown)="closeOverlay()"></div>
  <div class="pds-search__overlay"
    [style.top.px]="overlayTop"
    [style.left.px]="overlayLeft"
    [style.width.px]="overlayWidth"
    (mousedown)="$event.preventDefault()">
    <pds-selector
      [options]="filteredSuggestions"
      [width]="overlayWidth"
      [showCheckbox]="false"
      [showAvatar]="false"
      [showIcon]="true"
      (selectionChange)="onSuggestionSelected($event)"
    />
  </div>
}
